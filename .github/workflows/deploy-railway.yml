name: Deploy to Railway

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  RAILWAY_PROJECT_ID: 3c251192-1aa8-4d72-99db-796132bc5f3f
  RAILWAY_SERVICE_ID: 70c3a2b7-7dac-486e-a17f-0048fc07a5b2

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Railway (hacettepeisitme-web-production)
        run: |
          if [ -z "${RAILWAY_TOKEN}" ]; then
            echo "::error::RAILWAY_TOKEN yok — deploy atlandı. GitHub repo Secrets'a ekleyin veya Railway panelden Redeploy yapın."
            echo "Railway → Proje → Settings → Tokens → Create → GitHub: Papyonlubaskan/hacettepeisitme → Secrets → RAILWAY_TOKEN"
            exit 1
          fi
          railway up --detach --project "${RAILWAY_PROJECT_ID}" --service "${RAILWAY_SERVICE_ID}"
