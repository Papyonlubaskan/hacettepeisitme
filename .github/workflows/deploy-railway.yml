name: Deploy to Railway

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  RAILWAY_PROJECT_ID: 3c251192-1aa8-4d72-99db-796132bc5f3f
  RAILWAY_ENVIRONMENT_ID: 6455bbee-ac75-42f1-82f8-2b053ecea5f6
  RAILWAY_SERVICE_ID: 70c3a2b7-7dac-486e-a17f-0048fc07a5b2

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      VITE_GTM_ID: ${{ secrets.VITE_GTM_ID }}
      VITE_META_PIXEL_ID: ${{ secrets.VITE_META_PIXEL_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Railway build env (GTM / Pixel — secret varsa)
        run: |
          if [ -n "${VITE_GTM_ID}" ]; then
            railway variables --set "VITE_GTM_ID=${VITE_GTM_ID}" \
              --project "${RAILWAY_PROJECT_ID}" \
              --environment "${RAILWAY_ENVIRONMENT_ID}" \
              --service "${RAILWAY_SERVICE_ID}"
            echo "VITE_GTM_ID ayarlandı"
          else
            echo "VITE_GTM_ID secret yok — atlandı"
          fi
          if [ -n "${VITE_META_PIXEL_ID}" ]; then
            railway variables --set "VITE_META_PIXEL_ID=${VITE_META_PIXEL_ID}" \
              --project "${RAILWAY_PROJECT_ID}" \
              --environment "${RAILWAY_ENVIRONMENT_ID}" \
              --service "${RAILWAY_SERVICE_ID}"
            echo "VITE_META_PIXEL_ID ayarlandı"
          else
            echo "VITE_META_PIXEL_ID secret yok — atlandı"
          fi

      - name: Deploy to Railway (hacettepeisitme-web-production)
        run: |
          if [ -z "${RAILWAY_TOKEN}" ]; then
            echo "::error::RAILWAY_TOKEN yok"
            exit 1
          fi
          railway up --detach \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment "${RAILWAY_ENVIRONMENT_ID}" \
            --service "${RAILWAY_SERVICE_ID}"

  seo-ping:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ping search engines (Yandex + IndexNow)
        run: node scripts/ping-search-engines.mjs
