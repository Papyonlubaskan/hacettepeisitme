name: Deploy to Railway

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  RAILWAY_PROJECT_ID: 3c251192-1aa8-4d72-99db-796132bc5f3f

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Railway (hacettepeisitme-web-production)
        run: |
          if [ -z "${RAILWAY_TOKEN}" ]; then
            echo "::warning::RAILWAY_TOKEN yok. Railway proje token'ını GitHub Secrets'a ekleyin."
            exit 0
          fi
          railway up --detach --project "${RAILWAY_PROJECT_ID}"
